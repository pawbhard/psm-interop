---
apiVersion: v1
kind: Service
metadata:
  name: ${service_name}
  namespace: ${namespace_name}
  labels:
    owner: xds-k8s-interop-test
spec:
  type: ClusterIP
  selector:
    app: ${app_label}
  ports:
  - name: grpc
    port: ${test_port}
    protocol: TCP
    appProtocol: grpc
    targetPort: ${test_port}
...
